name: pypi

# Publishes summarix-telegram to PyPI on a GitHub release, through trusted publishing: no token in the repo.
# One-time setup on pypi.org by the owner: Publishing -> add a pending publisher with
# project summarix-telegram, owner AndreySukhanov, repository summarix-telegram, workflow pypi.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
